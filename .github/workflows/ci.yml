name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: filing_digest
          POSTGRES_PASSWORD: filing_digest_dev
          POSTGRES_DB: filing_digest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U filing_digest -d filing_digest"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://filing_digest:filing_digest_dev@localhost:5432/filing_digest
      EMBEDDING_WARMUP_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install dependencies
        run: |
          # KURE runs on CPU; PyPI's Linux torch wheel pulls in unused CUDA libraries.
          pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements.lock
          pip install ruff==0.15.21
      - name: Gate (backend)
        run: scripts/check.sh --part backend

  ios:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Gate (ios)
        run: scripts/check.sh --part ios
