name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: filing_digest
          POSTGRES_PASSWORD: filing_digest_dev
          POSTGRES_DB: filing_digest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U filing_digest -d filing_digest"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://filing_digest:filing_digest_dev@localhost:5432/filing_digest
      EMBEDDING_WARMUP_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          # KURE runs on CPU; PyPI's Linux torch wheel pulls in unused CUDA libraries.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r backend/requirements.txt
          pip install ruff==0.15.21
      - name: Lint, offline tests, and Compose validation
        run: make check PYTHON=python RUFF=ruff
      - name: PostgreSQL smoke and persistence tests
        run: make test-db PYTHON=python

  ios:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Runner images do not always ship the same simulators, so resolve one that
      # is actually installed instead of pinning a device name.
      - name: Build app and run iOS tests
        run: |
          simulator=$(xcrun simctl list devices available -j | jq -r '
            [.devices | to_entries[]
              | select(.key | contains("iOS"))
              | .value[]
              | select(.name | startswith("iPhone"))][0].udid')
          if [ -z "$simulator" ] || [ "$simulator" = "null" ]; then
            echo "No iPhone simulator is available on this runner image." >&2
            exit 1
          fi
          xcodebuild test \
            -project ios/FilingDigest.xcodeproj \
            -scheme FilingDigest \
            -destination "platform=iOS Simulator,id=$simulator" \
            CODE_SIGNING_ALLOWED=NO
