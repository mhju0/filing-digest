name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: filing_digest
          POSTGRES_PASSWORD: filing_digest_dev
          POSTGRES_DB: filing_digest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U filing_digest -d filing_digest"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://filing_digest:filing_digest_dev@localhost:5432/filing_digest
      EMBEDDING_WARMUP_ENABLED: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - name: Validate Docker Compose
        working-directory: .
        run: docker compose --profile container config -q
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install ruff==0.15.21
      - name: Lint
        run: ruff check .
      - name: Initialize database schema
        run: docker exec -i "${{ job.services.postgres.id }}" psql -U filing_digest -d filing_digest -v ON_ERROR_STOP=1 < db/init.sql
      - name: Seed smoke-test corpus
        run: docker exec -i "${{ job.services.postgres.id }}" psql -U filing_digest -d filing_digest -v ON_ERROR_STOP=1 < tests/fixtures/ci_smoke_seed.sql
      - name: Offline test suite
        run: python -m pytest -q --ignore=tests/test_smoke.py
      - name: PostgreSQL smoke suite
        run: python -m pytest -q tests/test_smoke.py

  ios:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Build app and run iOS tests
        run: >-
          xcodebuild test
          -project ios/FilingDigest.xcodeproj
          -scheme FilingDigest
          -destination 'platform=iOS Simulator,name=iPhone 16 Pro,OS=latest'
          CODE_SIGNING_ALLOWED=NO
